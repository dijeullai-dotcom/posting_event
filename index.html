<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>⚾ 야구 경기일 20게시글 이벤트 전광판</title>
  <style>
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border: #374151;
      --accent: #3b82f6;
      --success: #10b981;
      --gold: #fbbf24;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
      word-break: keep-all;
    }

    .meta {
      text-align: center;
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-head {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
    }

    .rank-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .row {
      display: flex;
      padding: 15px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.3s;
    }

    .row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .row.goal-achieved {
      background: rgba(251, 191, 36, 0.1);
      border-left: 4px solid var(--gold);
    }

    .rk {
      width: 40px;
      font-weight: bold;
      font-size: 1.2em;
      color: var(--text-sub);
      text-align: center;
      flex-shrink: 0;
    }

    .goal-achieved .rk {
      color: var(--gold);
    }

    .who {
      flex: 1;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .who span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 900;
    }

    .val {
      font-weight: bold;
      font-size: 1.2em;
      color: var(--accent);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .goal-achieved .val {
      color: var(--gold);
    }

    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge.success {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    /* Team Logos */
    .team-logo {
      width: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .team-logo img {
      width: 40px;
      height: auto;
      display: block;
      filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.5));
    }

    .no-team {
      font-weight: bold;
      font-size: 1.2em;
      color: var(--text-sub);
      text-align: center;
      flex-shrink: 0;
    }

    /* Progress bar */
    .progress-container {
      width: 120px;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin-right: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.5s ease-out;
    }

    .goal-achieved .progress-bar {
      background: var(--gold);
    }

    /* 모바일 반응형 (로고 좌측, 이름과 바가 우측에 위아래로 배치되는 원래의 예쁜 레이아웃) */
    @media (max-width: 500px) {
      body { padding: 10px; }
      h1 { font-size: 1.4em; margin-bottom: 10px; }
      .row { display: block; position: relative; padding: 12px 10px 12px 65px; gap: 0; }
      
      .team-logo { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
      
      .user-block { width: 100%; margin-bottom: 6px; display: block; }
      .name-block { display: block; }
      .uid { display: none; } /* ID 숨김 */
      
      .stat-block { width: 100%; margin-left: 0 !important; justify-content: flex-start; }
      .progress-container { width: 100%; max-width: 160px; flex: none; }
      .val { width: auto; font-size: 1.1em; }
    }

    /* Pulse animation for live update */
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .live-indicator { display: inline-block; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; animation: pulse 2s infinite; }
    
    /* Refresh Button */
    .refresh-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text-main); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
    .refresh-btn:hover { background: rgba(255,255,255,0.2); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1 onclick="toggleAdmin()" style="cursor: pointer;" title="관리자 전용 기능 숨겨짐">⚾ 오늘의 중계글 작성 현황판</h1>
    <div class="meta">
      <span class="live-indicator"></span>
      <span id="update-time">데이터를 불러오는 중...</span>
      <button id="refresh-btn" class="refresh-btn" onclick="manualRefresh()">↻ 새로고침</button>
      <button id="force-update-btn" class="refresh-btn" style="display:none; background:rgba(239,68,68,0.2); color:#ef4444; border-color:#ef4444; margin-left: 5px;" onclick="forceUpdate()">🚀 강제 갱신명령</button>
    </div>

    <div class="card">
      <div class="card-head">🎯 실시간 현황 (목표: 게시글 20개)</div>
      <ul class="rank-list" id="post-ranking">
        <li class="row" style="justify-content: center; color: var(--text-sub);">데이터를 불러오는 중입니다...</li>
      </ul>
    </div>
  </div>

  <script>
    const EVENT_GOAL = 20;
    let userTeamMap = {};
    const teamCodes = { "기아": "HT", "두산": "OB", "삼성": "SS", "한화": "HH", "롯데": "LT", "LG": "LG", "KT": "KT", "SSG": "SK", "NC": "NC", "키움": "WO" };

    // 최초에 팀 명단 로드
    fetch('teams.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        for (const [teamName, users] of Object.entries(data)) {
          const code = teamCodes[teamName];
          if (code) {
            users.forEach(user => {
              userTeamMap[user] = code;
            });
          }
        }
        fetchData();
        setInterval(fetchData, 10000);
      })
      .catch(err => {
        console.error("teams.json 로드 실패", err);
        fetchData();
        setInterval(fetchData, 10000);
      });

    function fetchData() {
      fetch('data.json?t=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
          document.getElementById('update-time').innerText = "최근 갱신: " + data.updated_at + " (실시간 연결중)";
          const postList = document.getElementById('post-ranking');
          postList.innerHTML = '';

          if (!data.rankings.posts || data.rankings.posts.length === 0) {
            postList.innerHTML = '<li class="row" style="justify-content: center; color: var(--text-sub);">아직 오늘 작성된 글이 없습니다.</li>';
            return;
          }

          data.rankings.posts.forEach((item, index) => {
            const isAchieved = item.count >= EVENT_GOAL;
            const rowClass = isAchieved ? "row goal-achieved" : "row";
            const progress = Math.min(100, (item.count / EVENT_GOAL) * 100) + "%";
            
            let rkHtml = `<div class="no-team" style="font-size: 1.6em; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));">⚾</div>`;
            const tCode = userTeamMap[item.nick];
            if (tCode) {
                rkHtml = `<img src="https://6ptotvmi5753.edge.naverncp.com/KBO_IMAGE/emblem/regular/2026/emblem_${tCode}.png" alt="${tCode}" style="width:40px; height:auto; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5));">`;
            }

            let rewardHtml = '';
            let rowAction = '';
            
            if (isAchieved && item.reward) {
                rewardHtml = `<div style="font-size: 0.85em; color: var(--gold); margin-top: 2px;">💎 [${item.reward.status}] ${item.reward.amount}랄</div>`;
                
                if (isAdmin) {
                    const copyText = `${item.nick} (${item.reward.team} - ${item.reward.status}) : ${item.reward.amount}랄 지급 대상`;
                    const url = `https://ygosu.com/board/pan_ahrisong/?mode=mineral_storage&mode2=withdraw&member=${item.id}`;
                    rowAction = `onclick="navigator.clipboard.writeText('${copyText}'); window.open('${url}', 'withdraw', 'width=600,height=800'); alert('클립보드 복사 완료!\\n[ ${copyText} ]\\n송금창 메시지에 붙여넣기 하세요!');" style="cursor: pointer;" title="클릭 시 송금창 팝업 열기"`;
                }
            }

            postList.innerHTML += `
              <li class="${rowClass}" ${rowAction}>
                <div class="user-block" style="display:flex; align-items:center;">
                  <div class="team-logo">${rkHtml}</div>
                  <div class="name-block">
                    <span class="nick" style="font-weight:900;">${item.nick}</span>
                    <span class="uid" style="font-size:0.8em; color:var(--text-sub);">(#${item.id})</span>
                    ${rewardHtml}
                  </div>
                </div>
                <div class="stat-block" style="display:flex; align-items:center; margin-left:auto;">
                  <div class="progress-container">
                    <div class="progress-bar" style="width: ${progress}"></div>
                  </div>
                  <div style="display:flex; align-items:center; gap:5px;">
                    <div class="val">${item.count} / ${EVENT_GOAL}</div>
                    ${isAchieved ? '<span class="badge success">🎉</span>' : ''}
                  </div>
                </div>
              </li>
            `;
          });
        })
        .catch(error => {
          console.error("데이터 연동 에러", error);
        });
    }

    function manualRefresh() {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.innerText = "⏳ 갱신 중...";
        fetchData();
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "↻ 새로고침";
        }, 2000);
    }

    let isAdmin = false;
    let clickCount = 0;
    function toggleAdmin() {
        clickCount++;
        if (clickCount >= 3) {
            isAdmin = !isAdmin;
            clickCount = 0;
            alert(isAdmin ? "🔐 관리자 모드 ON: 달성자 클릭 시 즉시 송금창 팝업이 열립니다." : "🔒 관리자 모드 OFF");
            document.getElementById('force-update-btn').style.display = isAdmin ? 'inline-block' : 'none';
            fetchData();
        }
        // 2초 내에 연속 클릭하지 않으면 초기화
        setTimeout(() => { clickCount = 0; }, 2000);
    }

    function forceUpdate() {
        let token = localStorage.getItem('github_pat');
        if (!token) {
            token = prompt("초기 1회 세팅: 깃허브 토큰(Personal Access Token)을 입력해주세요.\n(이 토큰은 관리자님의 스마트폰 브라우저에만 안전하게 저장됩니다.)");
            if (!token) return;
            localStorage.setItem('github_pat', token);
        }

        const btn = document.getElementById('force-update-btn');
        const oldText = btn.innerText;
        btn.innerText = "🚀 명령 전송 중...";
        btn.disabled = true;

        // GitHub Actions API 호출 (dijeullai-dotcom/posting_event 저장소 기준)
        fetch('https://api.github.com/repos/dijeullai-dotcom/posting_event/actions/workflows/update_data.yml/dispatches', {
            method: 'POST',
            headers: {
                'Accept': 'application/vnd.github.v3+json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ ref: 'main' })
        })
        .then(response => {
            if (response.status === 204) {
                alert("✅ 서버에 강제 갱신 명령을 내렸습니다!\n요리사가 요리를 시작했습니다. 약 1~2분 뒤에 [↻ 새로고침] 버튼을 눌러보세요.");
            } else if (response.status === 401 || response.status === 404) {
                alert("❌ 권한이 없습니다. 깃허브 토큰(PAT)이 잘못되었거나 권한(workflow)이 부족합니다.");
                localStorage.removeItem('github_pat'); // 토큰 초기화
            } else {
                alert("❌ 오류가 발생했습니다. 상태 코드: " + response.status);
            }
        })
        .catch(err => {
            alert("❌ 네트워크 오류가 발생했습니다.");
            console.error(err);
        })
        .finally(() => {
            btn.innerText = oldText;
            btn.disabled = false;
        });
    }
  </script>
</body>

</html>
