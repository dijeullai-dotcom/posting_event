<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>⚾ 야구 경기일 20게시글 이벤트 전광판</title>
  <style>
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border: #374151;
      --accent: #3b82f6;
      --success: #10b981;
      --gold: #fbbf24;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
      word-break: keep-all;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* 관리자 설정 모달 UI */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .admin-modal {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .admin-modal h2 { margin-top: 0; color: var(--text-main); font-size: 1.3em; margin-bottom: 20px; }
    .admin-modal label { display: block; font-size: 0.9em; color: var(--text-sub); margin-bottom: 6px; }
    .admin-modal input {
      width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 16px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-main); font-size: 1em;
    }
    .admin-modal input:focus { outline: none; border-color: var(--accent); }
    .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
    .modal-btns button {
      flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold;
      cursor: pointer; font-size: 1em; transition: opacity 0.2s;
    }
    .modal-btns button:hover { opacity: 0.8; }
    .save-btn { background: var(--accent); color: white; }
    .force-btn { background: #ef4444; color: white; }
    .force-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { margin-top: 15px; font-size: 0.9em; color: var(--success); text-align: center; min-height: 1.2em; word-break: break-all;}
    .status-msg.error { color: #ef4444; }

    .meta {
      text-align: center;
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-head {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
    }

    .rank-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .row {
      display: flex;
      padding: 15px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.3s;
    }

    .row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .row.goal-achieved {
      background: rgba(251, 191, 36, 0.1);
      border-left: 4px solid var(--gold);
    }

    .rk {
      width: 40px;
      font-weight: bold;
      font-size: 1.2em;
      color: var(--text-sub);
      text-align: center;
      flex-shrink: 0;
    }

    .goal-achieved .rk {
      color: var(--gold);
    }

    .row.paid-row {
      background: rgba(16, 185, 129, 0.05);
      border-left: 4px solid var(--success);
      opacity: 0.5;
    }
    .paid-row .val { color: var(--success) !important; }
    .paid-row .team-logo { filter: grayscale(100%); }

    .who {
      flex: 1;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .who span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 900;
    }

    .val {
      font-weight: bold;
      font-size: 1.2em;
      color: var(--accent);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .goal-achieved .val {
      color: var(--gold);
    }

    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge.success {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    /* Team Logos */
    .team-logo {
      width: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .team-logo img {
      width: 40px;
      height: auto;
      display: block;
      filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.5));
    }

    .no-team {
      font-weight: bold;
      font-size: 1.2em;
      color: var(--text-sub);
      text-align: center;
      flex-shrink: 0;
    }

    /* Progress bar */
    .progress-container {
      width: 120px;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin-right: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.5s ease-out;
    }

    .goal-achieved .progress-bar {
      background: var(--gold);
    }

    /* 모바일 반응형 (로고 좌측, 이름과 바가 우측에 위아래로 배치되는 원래의 예쁜 레이아웃) */
    @media (max-width: 500px) {
      body { padding: 10px; }
      h1 { font-size: 1.4em; margin-bottom: 10px; }
      .row { display: block; position: relative; padding: 12px 10px 12px 65px; gap: 0; }
      
      .team-logo { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
      
      .user-block { width: 100%; margin-bottom: 6px; display: block; }
      .name-block { display: block; }
      .uid { display: none; } /* ID 숨김 */
      
      .stat-block { width: 100%; margin-left: 0 !important; justify-content: flex-start; }
      .progress-container { width: 100%; max-width: 160px; flex: none; }
      .val { width: auto; font-size: 1.1em; }
    }

    /* Pulse animation for live update */
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .live-indicator { display: inline-block; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; animation: pulse 2s infinite; }
    
    /* Refresh Button */
    .refresh-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text-main); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9em; transition: background 0.2s; }
    .refresh-btn:hover { background: rgba(255,255,255,0.2); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1 onclick="toggleAdmin()" style="cursor: pointer;" title="관리자 전용 기능 숨겨짐">⚾ 오늘의 중계글 작성 현황판</h1>
    <div class="meta">
      <span class="live-indicator"></span>
      <span id="update-time">데이터를 불러오는 중...</span>
      <button id="refresh-btn" class="refresh-btn" onclick="manualRefresh()">↻ 새로고침</button>
    </div>

    <div class="card">
      <div class="card-head">🎯 실시간 현황 (목표: 게시글 20개)</div>
      <ul class="rank-list" id="post-ranking">
        <li class="row" style="justify-content: center; color: var(--text-sub);">데이터를 불러오는 중입니다...</li>
      </ul>
    </div>
  </div>

  <!-- 관리자 모달 -->
  <div class="modal-overlay" id="admin-modal" style="display: none;" onclick="closeAdminModal(event)">
    <div class="admin-modal" onclick="event.stopPropagation()">
      <h2>⚙️ 관리자 설정</h2>
      <label>GitHub 저장소 (owner/repo)</label>
      <input type="text" id="github-repo" placeholder="예: github-id/repo" autocomplete="off" spellcheck="false">
      <label>GitHub PAT (토큰)</label>
      <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" spellcheck="false">
      
      <div class="modal-btns">
        <button class="save-btn" onclick="saveAdminSettings()">💾 설정 저장</button>
        <button class="force-btn" id="modal-force-btn" onclick="triggerWorkflow()">🚀 서버 강제 갱신</button>
      </div>
      <div class="status-msg" id="admin-status"></div>
    </div>
  </div>

  <script>
    const EVENT_GOAL = 20;
    let userTeamMap = {};
    const teamCodes = { "기아": "HT", "두산": "OB", "삼성": "SS", "한화": "HH", "롯데": "LT", "LG": "LG", "KT": "KT", "SSG": "SK", "NC": "NC", "키움": "WO" };

    // 최초에 팀 명단 로드
    fetch('teams.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        for (const [teamName, users] of Object.entries(data)) {
          const code = teamCodes[teamName];
          if (code) {
            users.forEach(user => {
              userTeamMap[user] = code;
            });
          }
        }
        fetchData();
        setInterval(fetchData, 10000);
      })
      .catch(err => {
        console.error("teams.json 로드 실패", err);
        fetchData();
        setInterval(fetchData, 10000);
      });

    function fetchData() {
      fetch('data.json?t=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
          document.getElementById('update-time').innerText = "최근 갱신: " + data.updated_at + " (실시간 연결중)";
          const postList = document.getElementById('post-ranking');
          postList.innerHTML = '';

          if (!data.rankings.posts || data.rankings.posts.length === 0) {
            postList.innerHTML = '<li class="row" style="justify-content: center; color: var(--text-sub);">아직 오늘 작성된 글이 없습니다.</li>';
            return;
          }

          data.rankings.posts.forEach((item, index) => {
            const isAchieved = item.count >= EVENT_GOAL;
            // KST(한국 시간) 기준으로 날짜 문자열 생성 (UTC + 9시간)
            const kstTime = new Date().getTime() + (9 * 60 * 60 * 1000);
            const todayStr = new Date(kstTime).toISOString().split('T')[0];
            const paidKey = `paid_${todayStr}_${item.id}`;
            const isPaid = localStorage.getItem(paidKey) === 'true';

            let rowClass = "row";
            if (isAchieved) rowClass += " goal-achieved";
            if (isPaid) rowClass += " paid-row";

            const progress = Math.min(100, (item.count / EVENT_GOAL) * 100) + "%";
            
            let rkHtml = `<div class="no-team" style="font-size: 1.6em; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));">⚾</div>`;
            const tCode = userTeamMap[item.nick];
            if (tCode) {
                rkHtml = `<img src="https://6ptotvmi5753.edge.naverncp.com/KBO_IMAGE/emblem/regular/2026/emblem_${tCode}.png" alt="${tCode}" style="width:40px; height:auto; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5));">`;
            }

            let rewardHtml = '';
            let rowAction = '';
            
            if (isAchieved && item.reward) {
                if (isPaid) {
                    rewardHtml = `<div style="font-size: 0.85em; color: var(--success); margin-top: 2px;">✅ 지급완료 (${item.reward.amount}랄)</div>`;
                } else {
                    rewardHtml = `<div style="font-size: 0.85em; color: var(--gold); margin-top: 2px;">💎 [${item.reward.status}] ${item.reward.amount}랄</div>`;
                    
                    if (isAdmin) {
                        const cleanAmount = item.reward.amount.replace(/,/g, '');
                        let displayStatus = item.reward.status;
                        if (displayStatus === '우취') displayStatus = '우천취소';
                        const msg = `${item.reward.team} ${displayStatus}`;
                        
                        // URL hash를 이용해 데이터를 송금창으로 전달
                        const url = `https://ygosu.com/board/pan_ahrisong/?mode=mineral_storage&mode2=withdraw&member=${item.id}#amount=${cleanAmount}&msg=${encodeURIComponent(msg)}`;
                        rowAction = `onclick="window.open('${url}', 'withdraw', 'width=600,height=800');" style="cursor: pointer;" title="클릭 시 송금창 팝업 열기"`;
                    }
                }
            }

            postList.innerHTML += `
              <li class="${rowClass}" ${rowAction} id="user-row-${item.id}">
                <div class="user-block" style="display:flex; align-items:center;">
                  <div class="team-logo">${rkHtml}</div>
                  <div class="name-block">
                    <span class="nick" style="font-weight:900;">${item.nick}</span>
                    <span class="uid" style="font-size:0.8em; color:var(--text-sub);">(#${item.id})</span>
                    ${rewardHtml}
                  </div>
                </div>
                <div class="stat-block" style="display:flex; align-items:center; margin-left:auto;">
                  <div class="progress-container">
                    <div class="progress-bar" style="width: ${progress}"></div>
                  </div>
                  <div style="display:flex; align-items:center; gap:5px;">
                    <div class="val">${item.count} / ${EVENT_GOAL}</div>
                    ${isAchieved ? '<span class="badge success">🎉</span>' : ''}
                  </div>
                </div>
              </li>
            `;
          });
        })
        .catch(error => {
          console.error("데이터 연동 에러", error);
        });
    }

    function manualRefresh() {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.innerText = "⏳ 갱신 중...";
        fetchData();
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "↻ 새로고침";
        }, 2000);
    }

    let isAdmin = false;
    let clickCount = 0;
    let clickTimer = null;
    
    function toggleAdmin() {
        clickCount++;
        if (clickTimer) clearTimeout(clickTimer);
        
        if (clickCount >= 3) {
            clickCount = 0;
            openAdminModal();
        } else {
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
        }
    }

    function openAdminModal() {
        document.getElementById('admin-modal').style.display = 'flex';
        document.getElementById('github-repo').value = localStorage.getItem('github_repo') || '';
        document.getElementById('github-token').value = localStorage.getItem('github_pat') || '';
        document.getElementById('admin-status').innerText = '';
        document.getElementById('admin-status').className = 'status-msg';
    }

    function closeAdminModal(e) {
        if (e.target.id === 'admin-modal') {
            document.getElementById('admin-modal').style.display = 'none';
        }
    }

    function showStatus(msg, isError = false) {
        const statusEl = document.getElementById('admin-status');
        statusEl.innerText = msg;
        statusEl.className = 'status-msg' + (isError ? ' error' : '');
    }

    function saveAdminSettings() {
        const repo = document.getElementById('github-repo').value.trim();
        const token = document.getElementById('github-token').value.trim();
        if (!repo || !token) {
            showStatus("저장소 이름과 토큰을 모두 입력해주세요.", true);
            return;
        }
        localStorage.setItem('github_repo', repo);
        localStorage.setItem('github_pat', token);
        
        isAdmin = true;
        fetchData();
        
        showStatus("✅ 저장소와 토큰이 브라우저에 저장되었습니다.");
    }

    function triggerWorkflow() {
        const repo = document.getElementById('github-repo').value.trim();
        const token = document.getElementById('github-token').value.trim();
        
        if (!repo || !token) {
            showStatus("설정을 먼저 입력하고 저장해주세요.", true);
            return;
        }

        const btn = document.getElementById('modal-force-btn');
        const oldText = btn.innerText;
        btn.innerText = "명령 전송 중...";
        btn.disabled = true;
        showStatus("⏳ API 명령 전송 중...");

        const workflowFile = 'update_data.yml';

        fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflowFile}/dispatches`, {
            method: 'POST',
            headers: {
                'Accept': 'application/vnd.github.v3+json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ ref: 'main' })
        })
        .then(response => {
            if (response.status === 204) {
                showStatus("✅ 서버 강제 갱신 명령 전송 성공!");
            } else {
                response.json().then(data => {
                    showStatus(`❌ 전송 실패: ${data.message} (${response.status})`, true);
                    if (response.status === 401 || response.status === 404) {
                        localStorage.removeItem('github_pat');
                    }
                }).catch(() => {
                    showStatus(`❌ 전송 실패: 상태 코드 ${response.status}`, true);
                });
            }
        })
        .catch(err => {
            showStatus(`❌ 에러 발생: ${err.message}`, true);
        })
        .finally(() => {
            btn.innerText = oldText;
            btn.disabled = false;
        });
    }

    // 템퍼몽키에서 보낸 송금 완료 신호 수신 로직
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'TRANSFER_SUCCESS') {
            const userId = event.data.userId;
            if (userId) {
                // KST(한국 시간) 기준으로 날짜 문자열 생성
                const kstTime = new Date().getTime() + (9 * 60 * 60 * 1000);
                const todayStr = new Date(kstTime).toISOString().split('T')[0];
                // 브라우저 캐시에 '오늘 날짜_유저ID = 지급완료' 저장
                localStorage.setItem(`paid_${todayStr}_${userId}`, 'true');
                console.log(`✅ [${userId}] 송금 완료 신호 수신 및 저장 완료!`);
                
                // 화면 즉시 갱신
                fetchData();
            }
        }
    });
  </script>
</body>

</html>
