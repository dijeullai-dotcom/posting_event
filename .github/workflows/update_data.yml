name: Event Data Updater

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: 2. 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 3. 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 4. 크롤러 스크립트 실행
      run: python crawler.py
      
    - name: 5. 변경된 data.json 파일을 GitHub에 자동 커밋 및 푸시
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update event data"
        git push
