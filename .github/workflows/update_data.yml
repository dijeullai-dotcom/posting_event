name: Event Data Updater

on:
  schedule:
    # 한국시간(KST) 오후 1시 ~ 밤 12시 (UTC 4~15시) : 야구 변수(더블헤더, 주말, 우천지연, 연장전)를 모두 커버하는 시간대 -> 5분마다 갱신
    - cron: "*/5 4-15 * * *"
    # 한국시간(KST) 새벽 1시 ~ 정오 12시 (UTC 16~23시, 0~3시) : 야구가 없는 시간대 -> 서버비 절약을 위해 1시간마다 갱신
    - cron: "0 16-23,0-3 * * *"
  workflow_dispatch: # 수동으로 워크플로우를 실행할 수 있는 버튼 활성화

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: 2. 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 3. 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 4. 크롤러 스크립트 실행
      run: python crawler.py
      
    - name: 5. 변경된 data.json 파일을 GitHub에 자동 커밋 및 푸시
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "🤖 Auto-update event data"
          git pull --rebase origin main
          git push
        else
          echo "변경사항이 없어서 커밋을 건너뜁니다."
        fi
